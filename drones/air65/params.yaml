# BETAFPV Air65 II (65 mm brushless whoop), flown through skybridge:
# Betaflight angle mode over CRSF at 50 Hz, state from a depth camera.
#
# Where each number comes from:
#   [spec]    manufacturer data
#   [bbl]     Betaflight blackbox logs of 2026-09-20      (sysid/fit_air65.py)
#   [flight]  skybridge flight logs of 2026-11-13         (sysid/fit_air65.py)
#   [replay]  those flights replayed through this sim     (sysid/validate_replay.py --tune)
#   [est]     an estimate, not measured
# The command limits (max angle, yaw rate) are NOT here: they come from
# skybridge's configs/drone.yaml, see drones/constraints.py.
interface: betaflight_angle
model: model/air65/drone.xml

# ── Rigid body ──
mass: 0.028                 # kg [est] 17.8 g dry [spec] + battery + tracking plate. WEIGH IT.
                            # The throttle curve is tied to the measured hover throttle,
                            # so an error here hardly changes the accelerations.
inertia: [8.0e-6, 8.0e-6, 1.3e-5]    # kg m^2 [est] component layout; the blackbox only bounds
                            # roll to 8e-6..3e-5 and pitch to 5e-6..1e-5. The rate loop is
                            # modelled closed-loop, so this only matters when motors saturate.
arm_length: 0.02298         # m [spec] 65 mm diagonal -> 22.98 mm along x and y
yaw_torque_coeff: 0.006     # m [est] reaction torque per newton of thrust, 31 mm prop
max_motor_thrust: 0.2335    # N: hover thrust per motor x betaflight.max_thrust_ratio
dt: 0.004                   # s, physics and simulated flight controller at 250 Hz
frame_skip: 5               # policy at 50 Hz, the RC rate
g: 9.81

# ── Flight controller and motors (envs/betaflight.py) ──
betaflight:
  hover_throttle: 0.305     # [flight] 0.30-0.32 over three flights; rises as the battery sags
  min_check: 0.05           # Betaflight min_check 1050
  thrust_u0: 0.047          # [bbl] rpm ~ (u + 0.047)^0.835 * V^0.86, thrust ~ rpm^2
  thrust_expo: 1.5          # [bbl] 1.67 from rpm, [flight] 1.4 from climb response
  max_thrust_ratio: 3.4     # [bbl][est] rpm tops out near 52k, hover is at 28k. The rpm map is
                            # only measured up to 43 % motor output; above that is extrapolated.
  motor_tau_up: 0.035       # s [bbl] rpm follows the command with a 30-40 ms lag
  motor_tau_down: 0.035
  rc_tau: 0.013             # s, Betaflight RC smoothing (cutoff 37 Hz)
  level_kp: 5.0             # 1/s, Betaflight level P 50; [replay] agrees
  angle_ff: 0.7             # [replay]
  ff_tau: 0.03              # s [replay]
  rate_tau: [0.02, 0.02, 0.04]   # s [est]; the blackbox logs have no rate setpoint activity

# ── Aerodynamics: linear drag, acceleration per unit velocity (1/s) ──
aero:
  drag_xy: 0.2              # [replay] weakly identified: the flights stay below 1 m/s
  drag_z: 0.33              # [flight] 0.25-0.4
  gust_accel: [0.0, 0.25]   # m/s^2, 1 sigma of a slowly wandering disturbance [est]: indoor air,
  gust_tau: 1.0             # s      ground effect. Sized so altitude hold wanders as in flight.

# ── Radio link and sensors, seconds. [a, b] is drawn per episode ──
link:
  action_delay: [0.03, 0.07]        # [replay] 0.045: RC tick, ELRS, receiver
  camera_period: 0.0333             # 30 Hz depth
  camera_latency: [0.02, 0.05]      # capture to the RC loop; skybridge logs 12-15 ms to output
  camera_drop: 0.07                 # [flight] 152 of 2310 frames skipped
  velocity_tau: [0.05, 0.11]        # [replay] 0.08: lag of the tracker's velocity filter
  attitude_period: [0.05, 0.09]     # [flight] telemetry every 59 ms median, 80-100 ms p95
  attitude_latency: [0.07, 0.12]    # [replay] 0.09

noise:                      # 1 sigma, per sample [est, checked against the altitude-hold logs]
  position: 0.004           # m
  velocity: 0.012           # m/s
  attitude_deg: 0.3

# ── Per-episode variation ──
randomize:
  mass: [0.9, 1.1]
  thrust: [0.85, 1.15]      # battery: hover throttle 0.30-0.32 in flight, thrust ~ V^1.7 [bbl]
  drag: [0.5, 2.0]
  motor_tau: [0.7, 1.3]
  angle_trim_deg: 3.0       # [replay] the real drone drifts as if tilted 1-3.6 deg at zero stick
  heading_error_deg: 10.0   # FC yaw drifts about 0.5 deg/s between plate corrections

# ── Task ──
env:
  episode_steps: 500        # 10 s at 50 Hz
  throttle_range: [0.05, 0.56]      # the policy's throttle span, centred on hover
  max_yaw_rate_dps: 120.0   # tighter than skybridge's limit; hovering needs little yaw
  max_tilt_deg: 60.0        # beyond this the episode ends
  obs_pos: 2.0              # observation scales: m, m/s, deg
  obs_vel: 3.0
  obs_tilt_deg: 60.0
  obs_int: 1.0              # m s: where the error integral saturates
  int_zone: 0.3             # m: an axis integrates only while its error is below this (no windup on approach)
  action_history: 10        # commands in the observation (200 ms): covers the worst action delay plus
                            # attitude latency (70 + 120 ms). 1 = the original 16D observation.
  # true state: x, y, z, roll, pitch, yaw, vx, vy, vz, wx, wy, wz
  initial:
    low:  [-0.6, -0.6, 0.3, -0.17, -0.17, -3.14, -0.4, -0.4, -0.3, -0.5, -0.5, -0.5]
    high: [ 0.6,  0.6, 1.2,  0.17,  0.17,  3.14,  0.4,  0.4,  0.3,  0.5,  0.5,  0.5]
  target:
    low:  [-0.6, -0.6, 0.4]
    high: [ 0.6,  0.6, 1.2]
  bounds:                   # leaving this box ends the episode (the camera's flight volume)
    low:  [-1.2, -1.2, 0.05]
    high: [ 1.2,  1.2, 1.8]

reward:
  alive: 0.2                # per step: keeps the reward positive far from the target, so crashing never pays
  pos_scale: 0.5            # m: broad term exp(-(error / pos_scale)^2), finds the target
  pos_fine: 1.0             # weight of a narrow term that rewards staying on it:
  pos_fine_scale: 0.1       # m, 5 cm error -> 0.78, 10 cm -> 0.37 (the broad term alone gives 0.96 at 10 cm)
  action_rate: 0.5          # cost on the squared change of the normalized action (was 0.05: negligible)
  velocity: 0.05            # cost on the squared velocity, m^2/s^2: penalises oscillating around the target
  heading: 0.05             # cost on the squared heading error / pi

# ── Altitude hold (envs/althold_env.py): the pilot flies roll/pitch/yaw, the policy throttle ──
# The policy sees no attitude telemetry: the pilot's sticks stand in for it. Ranges here
# override or extend the ones above for this task only. [a, b] is drawn per episode,
# a scalar r means nominal +- r. A curriculum (train.py) pulls every draw towards
# nominal early in training and widens it to these ranges.
althold:
  episode_steps: 1000       # 20 s at 50 Hz: long enough for the battery sag to matter
  throttle_range: [0.05, 0.56]
  stick_history: 5          # stick commands in the observation (100 ms)
  throttle_history: 10      # throttle commands in the observation (200 ms)
  obs: {err: 1.0, vz: 2.0, int: 0.5, age: 0.5}   # m, m/s, m s, s
  int_zone: 0.3             # m: the error integral only grows within this of the target
  start_xy: 0.6             # m
  start_z: [0.4, 1.4]       # m, where the policy is engaged
  start_vz: [-0.5, 0.5]     # m/s, the pilot was not quite holding altitude
  start_tilt_deg: 10.0
  start_throttle_error: 0.1 # the pilot's throttle at hand-over, x(1 +- this) of hover
  target_offset: [-0.3, 0.3]    # m, in this share of episodes the target is off the
  target_offset_share: 0.5      # engagement altitude (practice coming back after a sag)
  z_bounds: [0.05, 2.2]     # m: floor and ceiling end the episode
  max_tilt_deg: 75.0

  randomize:
    mass: [0.85, 1.2]
    thrust_sag: [0.0, 0.08]       # battery: share of thrust lost over the episode
    thrust_expo: [1.3, 1.8]       # [bbl] 1.67 vs [flight] 1.4
    thrust_u0: [0.02, 0.08]
    max_thrust_ratio: [2.6, 3.8]
    motor_tau_up: [0.6, 1.5]      # x nominal, drawn apart from motor_tau_down
    motor_tau_down: [0.6, 1.5]
    inertia: [0.7, 1.5]           # x nominal; the FC's tuning stays nominal
    level_kp: [0.7, 1.3]          # x nominal
    angle_ff: [0.4, 1.0]
    rc_tau: [0.7, 1.5]            # x nominal
    rate_tau: [0.7, 1.5]          # x nominal
    angle_scale: [0.85, 1.15]     # real angle / commanded angle
    angle_trim_deg: 4.0
    translational_lift: [0.0, 0.10]   # thrust gain per m/s of horizontal speed (up to 1.5 m/s)
    descent_loss: [0.0, 0.15]     # thrust lost when sinking 1 m/s faster than 0.5 m/s
    depth_scale: 0.03             # camera depth scale error

  link:
    action_delay: [0.02, 0.09]
    camera_latency: [0.02, 0.07]
    camera_drop: [0.0, 0.15]
    outage_rate: [0.0, 0.2]       # camera outages per second ...
    outage_duration: [0.1, 0.5]   # ... lasting this long, s
    loop_jitter: 0.003            # s, +- on when a command leaves the laptop
    missed_step: 0.01             # share of RC ticks the laptop misses

  noise:
    position: [0.002, 0.010]      # m
    velocity: [0.008, 0.025]      # m/s

  aero:
    gust_accel: [0.0, 0.4]        # m/s^2

  pilot:
    aggressiveness: [0.0, 1.0]
    calm_share: 0.2               # episodes where the pilot only keeps the drone in view
    return_kp: [0.5, 1.5]         # 1/s^2, pull back to the centre of the view
    return_kd: [0.8, 1.6]         # 1/s
    reaction_s: [0.15, 0.35]
    wander: 0.6                   # x full stick, 1 sigma at full aggressiveness
    wander_tau: [0.3, 2.0]        # s
    punch_rate: 0.4               # per s at full aggressiveness
    punch_s: [0.2, 1.0]
    yaw_wander_dps: 60.0
    spin_rate: 0.1                # per s at full aggressiveness
    spin_dps: [90.0, 200.0]
    stick_noise: 0.003            # x full stick

  reward:
    alive: 0.2
    alt_scale: 0.3                # m, broad term
    alt_fine: 1.0
    alt_fine_scale: 0.05          # m, narrow term
    climb: 0.1                    # cost on true vz^2
    action_rate: 1.0              # cost on the squared change of the normalized throttle
